# Análise automática do SonarCloud (workspace de documentação)
# Os 3 formatos do DER e as specs repetem conteúdo de propósito (mesmo modelo em DBML, SQL e PlantUML;
# mesma estrutura em cada spec), então ficam fora da detecção de duplicação.
sonar.cpd.exclusions=docs/**,specs/**,Apresentacao-Banca/**
# O DDL do DER é PostgreSQL; o analisador PL/SQL (Oracle) aplica regras que não valem para ele.
sonar.exclusions=docs/Diagramas/DER/chartdb/**
